# CI d'agentline : tests à chaque push ; sur un tag vX.Y.Z, construction des binaires (Windows, Linux,
# macOS), publication dans le registre de paquets du projet, puis version GitLab avec les liens.
stages: [test, construire, publier]

variables:
  GOTOOLCHAIN: local # pas de téléchargement d'une autre version de Go pendant la CI
  GOFLAGS: -mod=readonly

tests:
  stage: test
  image: golang:1.27
  script:
    # Bloc littéral : sans lui, « gofmt : » serait lu par YAML comme une clé et la configuration refusée
    - |
      test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt : fichiers à formater"; exit 1; }
    - go vet ./...
    - go test ./...
    - go run golang.org/x/vuln/cmd/govulncheck@latest ./...

construire:
  stage: construire
  image: golang:1.27
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - bash scripts/construire.sh "${CI_COMMIT_TAG#v}"
  artifacts:
    paths: [dist/]
    expire_in: 1 week

publier:
  stage: publier
  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - V=${CI_COMMIT_TAG#v}
    - |
      for f in dist/$V/*; do
        curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/agentline/$V/$(basename "$f")"
      done

version:
  stage: publier
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [publier]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    # Les liens sont calculés ici : le mot-clé « release: » ne sait pas retirer le « v » du tag
    - V=${CI_COMMIT_TAG#v}
    - P=$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/agentline/$V
    - |
      release-cli create --name "agentline $CI_COMMIT_TAG" --tag-name "$CI_COMMIT_TAG" \
        --description "Binaires d'agentline pour Windows, Linux et macOS, sommes SHA-256, manifestes Scoop (agentline.json) et Homebrew (agentline.rb)." \
        --assets-link "{\"name\":\"Windows (amd64)\",\"url\":\"$P/agentline_${V}_windows_amd64.exe\"}" \
        --assets-link "{\"name\":\"Linux (amd64)\",\"url\":\"$P/agentline_${V}_linux_amd64\"}" \
        --assets-link "{\"name\":\"Linux (arm64)\",\"url\":\"$P/agentline_${V}_linux_arm64\"}" \
        --assets-link "{\"name\":\"macOS (Apple Silicon)\",\"url\":\"$P/agentline_${V}_darwin_arm64\"}" \
        --assets-link "{\"name\":\"macOS (Intel)\",\"url\":\"$P/agentline_${V}_darwin_amd64\"}" \
        --assets-link "{\"name\":\"SHA256SUMS\",\"url\":\"$P/SHA256SUMS\"}"
