# Tests d'agentline sur Linux, macOS et Windows, govulncheck, shellcheck et actionlint, à chaque push sur main
# et sur chaque pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Pas de GOTOOLCHAIN=local ici : setup-go ignorerait alors la ligne toolchain de go.mod (1.27.3) pour la ligne go
# (1.26.0). Le go installé est déjà celui de la ligne toolchain, il ne télécharge donc rien d'autre.
env:
  GOFLAGS: -mod=readonly

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          fichiers=$(gofmt -l .)
          if [[ -n $fichiers ]]; then
            echo "::error::files not formatted with gofmt:"
            echo "$fichiers"
            exit 1
          fi
      - name: no raw ESC byte in Go sources
        if: runner.os == 'Linux'
        run: |
          if git ls-files -z '*.go' | xargs -0 grep -l $'\x1b'; then
            printf '%s\n' '::error::raw ESC byte in the files above: write it as \x1b'
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ${{ runner.os == 'Linux' && '-race' || '' }} ./...

  go-minimum:
    # la version de la ligne go de go.mod (celle que demande golang.org/x/sys) : go install doit y marcher
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local # sinon go passerait à la 1.27.3 de la ligne toolchain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: shellcheck
        # préinstallé sur ubuntu-latest ; chaque remarque devient une annotation (visible sans se connecter)
        run: |
          shellcheck --version
          shellcheck -f gcc scripts/*.sh | awk -F: '{ m = $0; sub(/^[^:]*:[0-9]+:[0-9]+: /, "", m); printf "::error file=%s,line=%s,col=%s::%s\n", $1, $2, $3, m }'
          exit "${PIPESTATUS[0]}"
      - name: actionlint
        # vérifie aussi les run: avec shellcheck ; chaque remarque devient une annotation
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -oneline -no-color | awk -F: '{ m = $0; sub(/^[^:]*:[0-9]+:[0-9]+: /, "", m); printf "::error file=%s,line=%s,col=%s::%s\n", $1, $2, $3, m }'
          exit "${PIPESTATUS[0]}"
