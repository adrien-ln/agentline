# Tests d'agentline sur Linux, macOS et Windows, govulncheck, shellcheck et actionlint, à chaque push sur main
# et sur chaque pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local # la version de go.mod, installée par setup-go : pas d'autre téléchargement
  GOFLAGS: -mod=readonly

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          fichiers=$(gofmt -l .)
          if [[ -n $fichiers ]]; then
            echo "::error::files not formatted with gofmt:"
            echo "$fichiers"
            exit 1
          fi
      - name: no raw ESC byte in Go sources
        if: runner.os == 'Linux'
        run: |
          if git ls-files -z '*.go' | xargs -0 grep -l $'\x1b'; then
            echo "::error::raw ESC byte in the files above: write it as \\x1b"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ${{ runner.os == 'Linux' && '-race' || '' }} ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: shellcheck
        run: shellcheck --version && shellcheck scripts/*.sh # préinstallé sur ubuntu-latest
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 # vérifie aussi les run: avec shellcheck
