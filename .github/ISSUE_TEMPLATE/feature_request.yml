name: Feature request
description: Suggest a new item, option, theme or command
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The need behind the request, in your own workflow
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How agentline could do it (command, key, style option, look of the statusline)
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would like to implement it myself (see CONTRIBUTING.md)
