name: Bug report
description: Something in the statusline, the picker or the installer does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, please use private reporting instead (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `agentline version`
      placeholder: agentline 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal and shell
      description: For example Windows Terminal with PowerShell 7, iTerm2 with zsh, over SSH or not
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: Harness
      description: The tool that runs the statusline, and its version
      placeholder: Claude Code 2.x
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `agentline doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. agentline theme set nord
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: A screenshot helps for rendering problems
    validations:
      required: true
