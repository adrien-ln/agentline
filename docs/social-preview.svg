<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- Image de la fiche GitHub (Settings > Social preview), même identité que docs/banniere.svg.
       docs/social-preview.png en est la capture par Edge headless, fenêtre de 1280 × 640. -->
  <style>
    text { font-family: "Cascadia Code", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; }
  </style>
  <defs>
    <linearGradient id="titre" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#7dcfff"/>
    </linearGradient>
    <linearGradient id="jauge" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#9ece6a"/>
      <stop offset="1" stop-color="#e0af68"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="#1a1b26"/>

  <text x="640" y="232" text-anchor="middle" font-size="124" font-weight="700" fill="url(#titre)">agentline</text>
  <text x="640" y="292" text-anchor="middle" font-size="30" fill="#737aa2">the Claude Code statusline · 49 themes · one binary</text>

  <!-- Une statusline Tokyo Night dans un cadre de terminal -->
  <rect x="190" y="352" width="900" height="150" rx="14" fill="#16161e" stroke="#292e42" stroke-width="2"/>
  <text x="640" y="415" text-anchor="middle" font-size="27" xml:space="preserve"><tspan fill="#bb9af7" font-weight="700">Opus 5.5</tspan><tspan fill="#7aa2f7"> ϟ</tspan><tspan fill="#737aa2"> high </tspan><tspan fill="#3b4261">│ </tspan><tspan fill="#c0caf5" font-weight="700">my-project</tspan><tspan fill="#7dcfff">  ⎇ main</tspan><tspan fill="#9ece6a"> ✓</tspan><tspan fill="#3b4261"> │ </tspan><tspan fill="#7dcfff">#12</tspan><tspan fill="#9ece6a"> approved</tspan></text>
  <text x="640" y="461" text-anchor="middle" font-size="27" xml:space="preserve"><tspan fill="#737aa2">ctx </tspan><tspan fill="url(#jauge)">━━━━━━╸</tspan><tspan fill="#545c7e">────── </tspan><tspan fill="#e0af68">42%</tspan><tspan fill="#3b4261"> · </tspan><tspan fill="#737aa2">5h </tspan><tspan fill="#ff9e64">61% </tspan><tspan fill="#f7768e">↗76%</tspan><tspan fill="#3b4261"> · </tspan><tspan fill="#737aa2">7d </tspan><tspan fill="#9ece6a">23%</tspan></text>

  <text x="640" y="560" text-anchor="middle" font-size="22" fill="#565f89">Windows · Linux · macOS  —  English · Français  —  MIT</text>
